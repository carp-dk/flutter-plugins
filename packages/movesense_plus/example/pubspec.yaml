name: movesense_plus_example
description: "An example of how to use the movesense_plus plugin."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  movesense_plus:
    path: ../../movesense_plus/

  cupertino_icons: ^1.0.2
  permission_handler: ^11.0.0
  polar: ^7.0.0
  sembast: ^3.5.0
  path_provider: ^2.1.0
  mdsflutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true